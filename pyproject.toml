[project]
name = "flightwall-tools"
version = "1.0.0"
description = "Build data, package, check and deploy the FlightWall Roku channel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4",
]

[project.scripts]
flightwall = "flightwall_tools.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/flightwall_tools"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstring style rules; docstrings are present where they add value
    "COM812",  # trailing-comma rule conflicts with the formatter
    "ISC001",  # implicit string concatenation rule conflicts with the formatter
    "T201",    # the CLI prints to the terminal on purpose
    "S310",    # URL schemes are validated before urllib opens them
    "FBT001",  # boolean positional arguments are used for small internal helpers
    "FBT002",
    "PLR0913", # argparse wiring and raster helpers take several explicit parameters
    "PLR0917",
    "TC001",   # runtime imports are kept plain; `from __future__ import annotations` is used
    "TC002",
    "TC003",
    "CPY001",  # no copyright header convention in this repository
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest assertions
    "S105",    # fake passwords in fixtures
    "S106",
    "PLR2004", # literal expected values
    "ANN401",
    "SLF001",
    "ARG001",  # fakes accept arguments they ignore
    "ARG002",
    "ARG005",
    "FBT003",  # positional booleans mirror the signatures under test
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["tools", "tests"]
mypy_path = "tools"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flightwall_tools --cov-branch --cov-report=term-missing --cov-fail-under=100 -q"
pythonpath = ["tools"]

[tool.coverage.run]
branch = true
source = ["flightwall_tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
